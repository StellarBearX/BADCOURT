[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "badhud"
version = "0.1.0"
description = "Game-style HUD overlay for single-rally badminton clips"
requires-python = ">=3.9"
dependencies = [
  "numpy", "scipy", "opencv-python-headless", "pillow", "pyyaml", "ultralytics", "lap",
]

[project.scripts]
hud = "badhud.main:main"

[tool.setuptools]
packages = ["badhud"]

[tool.setuptools.package-data]
badhud = ["fonts/*"]
